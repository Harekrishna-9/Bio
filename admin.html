<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harekrishna Bio Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f7fbff;font-family:Inter,sans-serif}.wrap{width:min(880px,calc(100% - 20px));margin:auto;padding:20px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top a{color:#7ff0aa;text-decoration:none}.card{margin-top:14px;border:1px solid rgba(255,255,255,.1);background:#0d1a2c;border-radius:22px;padding:16px}.card h2{font-size:14px;margin:0 0 12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:9px}label{font-size:10px;color:#91a4ba;display:block;margin-bottom:5px}input,textarea,select{width:100%;border:1px solid rgba(255,255,255,.12);background:#07111f;color:white;border-radius:12px;padding:11px;outline:none}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:12px;padding:11px 14px;background:#28d17c;color:#04110b;font-weight:800;cursor:pointer}.danger{background:#ff6b6b;color:white}.muted{background:#17263a;color:white}.list{display:grid;gap:8px}.item{border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{color:#8da1b8}.notice{font-size:10px;line-height:1.6;color:#9cb0c6}.notice b{color:#fff}.login{max-width:430px;margin:80px auto}.hide{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.full{width:100%}.pill{display:inline-block;border:1px solid rgba(255,255,255,.12);padding:6px 9px;border-radius:999px;font-size:9px;color:#9fb1c5}.preview{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#06101c}.progress{font-size:10px;color:#7ff0aa;margin-top:6px}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginBox" class="card login">
    <h2>Secure Bio Admin</h2>
    <p class="notice">Supabase Authentication se login hoga. Email fixed hai.</p>
    <div class="field"><label>Email</label><input id="email" value="pharekrishna09@gmail.com" readonly></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="Supabase admin password"></div>
    <button class="full" id="loginBtn">Login</button>
    <div class="progress" id="loginMsg"></div>
  </div>

  <div id="admin" class="hide">
    <div class="top">
      <div><b>Harekrishna Bio Admin</b><div class="pill">Supabase Live</div></div>
      <div class="actions"><a href="index.html">View Profile</a><button class="muted" id="logoutBtn">Logout</button></div>
    </div>

    <section class="card">
      <h2>Daily Note & Music</h2>
      <div class="field"><label>Daily Note</label><input id="note" maxlength="100"></div>
      <div class="row">
        <div class="field"><label>Music Title</label><input id="musicTitle"></div>
        <div class="field"><label>Direct Audio URL</label><input id="musicUrl" placeholder="https://...mp3"></div>
      </div>
      <button id="saveSettings">Save Settings</button>
    </section>

    <section class="card">
      <h2>Add 24-Hour Story</h2>
      <div class="row">
        <div class="field"><label>Type</label><select id="storyType"><option value="image">Image</option><option value="video">Video</option><option value="text">Text</option></select></div>
        <div class="field"><label>Emoji (for text story)</label><input id="storyEmoji" value="✨"></div>
      </div>
      <div class="field"><label>Story Text</label><textarea id="storyText" placeholder="Text story ke liye"></textarea></div>
      <div class="field"><label>Photo / Video file</label><input id="storyFile" type="file" accept="image/*,video/*"></div>
      <button id="addStory">Upload Story</button>
      <div class="progress" id="storyMsg"></div>
      <div class="list" id="storyList" style="margin-top:10px"></div>
    </section>

    <section class="card">
      <h2>Create Highlight</h2>
      <div class="row">
        <div class="field"><label>Name</label><input id="hlName" placeholder="Prem Mart"></div>
        <div class="field"><label>Emoji</label><input id="hlEmoji" value="⭐"></div>
      </div>
      <div class="field"><label>Optional Cover Image</label><input id="hlCover" type="file" accept="image/*"></div>
      <button id="addHighlight">Create Highlight</button>
      <div class="list" id="highlightList" style="margin-top:10px"></div>
    </section>

    <section class="card">
      <h2>Add Item to Highlight</h2>
      <div class="row">
        <div class="field"><label>Highlight</label><select id="hlSelect"></select></div>
        <div class="field"><label>Type</label><select id="hlItemType"><option value="image">Image</option><option value="video">Video</option><option value="text">Text</option></select></div>
      </div>
      <div class="field"><label>Text</label><textarea id="hlItemText"></textarea></div>
      <div class="field"><label>Photo / Video</label><input id="hlItemFile" type="file" accept="image/*,video/*"></div>
      <button id="addHighlightItem">Add to Highlight</button>
    </section>

    <section class="card">
      <h2>Gallery</h2>
      <div class="row">
        <div class="field"><label>Image</label><input id="galleryFile" type="file" accept="image/*"></div>
        <div class="field"><label>Caption</label><input id="galleryCaption"></div>
      </div>
      <button id="addGallery">Upload Image</button>
      <div class="list" id="galleryList" style="margin-top:10px"></div>
    </section>

    <section class="card">
      <h2>Guest Messages</h2>
      <div class="list" id="messageList"></div>
    </section>

    <section class="card">
      <h2>Stats</h2>
      <div class="list" id="statsList"></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
